<!DOCTYPE html>
<html lang="nl">
	<head>
		<meta charset="UTF-8">
		<link rel="icon" type="image/svg+xml" href="./public/favicon.svg">
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		>
		<title>MALL SIM — Prairie Lakes</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		>
		<style>
			#app-loading {
				position: fixed;
				inset: 0;
				z-index: 99999;
				display: grid;
				place-content: center;
				gap: 14px;
				background: #f4efe4;
				color: #151515;
				font: 700 15px/1.3 Outfit, system-ui, sans-serif;
				letter-spacing: 0.08em;
				text-align: center;
			}
			.app-loading-mark {
				width: 52px;
				height: 52px;
				margin: auto;
				border: 5px solid #d9d0bd;
				border-top-color: #e30613;
				border-radius: 50%;
				animation: mall-spin 0.8s linear infinite;
			}
			@keyframes mall-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<div id="app-loading" role="status" aria-live="polite">
			<div class="app-loading-mark" aria-hidden="true"></div>
			Prairie Lakes wordt geopend…
		</div>
		<div id="canvas-root"></div>
		<div id="ui-root"></div>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
