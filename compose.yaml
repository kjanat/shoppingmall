services:
  mall:
    build: { context: ., args: { GIT_DESCRIBE: "${GIT_DESCRIBE:-}" } }
    image: mall-sim
    container_name: mall-sim
    restart: unless-stopped
    env_file: .env
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.kruidvat.rule=Host(`kruidvat.kajkowalski.nl`)
      - traefik.http.routers.kruidvat.entrypoints=websecure
      - traefik.http.routers.kruidvat.tls=true
      - traefik.http.routers.kruidvat.middlewares=security-headers@file
      - traefik.http.routers.kruidvat.service=kruidvat
      - traefik.http.services.kruidvat.loadbalancer.server.port=5174
    # Audio plus .mall/crate.sqlite persist together; the entrypoint repairs only this writable boundary.
    volumes: [./public/dj-music:/app/public/dj-music]
networks: { traefik: { external: true } }
