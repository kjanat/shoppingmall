name: Deploy to GitHub Pages
on: { push: { branches: [master] }, workflow_dispatch: null }
permissions: { contents: read, pages: write, id-token: write }

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    concurrency: { group: pages-build, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # GITHUB_ACTIONS is set here, so build.ts emits the static Pages bundle
      # (client only — no /api, so DJ Bartek and the voices stay quiet).
      - name: Build
        run: bun run build

      - uses: actions/configure-pages@v6
        with: { enablement: true }

      - uses: actions/upload-pages-artifact@v5
        with: { path: dist/static }

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    concurrency: { group: pages-deploy, cancel-in-progress: false }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps: [{ id: deployment, uses: actions/deploy-pages@v5 }]
